<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="hours"><style>
.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.grid{stroke:#e4e3df}.axis{stroke:#b9b8b2}.dna{stroke:#52514e;fill:#fcfcfb}.lost{fill:#d03b3b}
.h0{fill:#e8f1fc}.h1{fill:#cde2fb}.h2{fill:#9ec5f4}.h3{fill:#6da7ec}.h4{fill:#3987e5}.h5{fill:#256abf}.h6{fill:#184f95}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#f0efec}.ink2{fill:#c3c2b7}.grid{stroke:#2c2c2a}.axis{stroke:#5a5955}.dna{stroke:#c3c2b7;fill:#1a1a19}.lost{fill:#e66767}.h0{fill:#1f2a38}.h1{fill:#173a66}.h2{fill:#1c5cab}.h3{fill:#2a78d6}.h4{fill:#5598e7}.h5{fill:#86b6ef}.h6{fill:#b7d3f6}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
</style><rect class="bg" width="760" height="300" rx="8"/><text x="16.0" y="24.0" class="ink" font-size="15" text-anchor="start" font-weight="600">Hours of one generation, by step</text><text x="16.0" y="42.0" class="ink2" font-size="12" text-anchor="start" font-weight="normal">from its first job to its record; the dashed line is the bar of 5 hours</text><line class="grid" x1="52" x2="630" y1="256.0" y2="256.0" stroke-width="1"/><text x="44.0" y="260.0" class="ink2" font-size="11" text-anchor="end" font-weight="normal">0 h</text><line class="grid" x1="52" x2="630" y1="206.5" y2="206.5" stroke-width="1"/><text x="44.0" y="210.5" class="ink2" font-size="11" text-anchor="end" font-weight="normal">2 h</text><line class="grid" x1="52" x2="630" y1="157.0" y2="157.0" stroke-width="1"/><text x="44.0" y="161.0" class="ink2" font-size="11" text-anchor="end" font-weight="normal">4 h</text><line class="grid" x1="52" x2="630" y1="107.5" y2="107.5" stroke-width="1"/><text x="44.0" y="111.5" class="ink2" font-size="11" text-anchor="end" font-weight="normal">6 h</text><line class="grid" x1="52" x2="630" y1="58.0" y2="58.0" stroke-width="1"/><text x="44.0" y="62.0" class="ink2" font-size="11" text-anchor="end" font-weight="normal">8 h</text><line class="axis" x1="52" x2="630" y1="132.2" y2="132.2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="341.0" y="149.0" class="ink2" font-size="12" text-anchor="middle" font-weight="normal">no generation&#x27;s record says its hours yet</text><text x="341.0" y="167.0" class="ink2" font-size="11" text-anchor="middle" font-weight="normal">the record job writes minutes_by_step (or hours) from the run&#x27;s jobs</text></svg>
