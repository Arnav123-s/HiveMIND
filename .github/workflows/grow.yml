# The hive grows, with nobody there (training/grow.py).
#
# The hive is one body: one ternary model (its DNA) and many cells, each the DNA with a small weight edit of its
# own. All cells are the same size. Each leans to one organ (sources, code, data, words) and knows the others' work
# too, so any two can check each other. The body's newest cells are averaged into one edit, the trunk, which answers
# every task first: that is how many cells act as one.
#
#   practice   several runners at once: the trunk and the body's cells do fresh tasks that are never an exam's, half
#              of them several tasks in one, as hard as the body's levels say (cells/body.json). Each runner also goes
#              back to tasks the body got wrong before. A task counts only when two members agreed and the task's
#              own check, computed by code, confirms the answer.
#   gather     every row checked so far: those of earlier generations (in the release) and this one's.
#   plan       which cells have children this generation (training/lineage.py): the body multiplies, it is not
#              replaced.
#   train      a child starts as its parent's edit pulled halfway to the trunk, and is trained on all the rows: this
#              generation's and its parent's corrected mistakes most, its own organ's rows three times as often. One
#              runner for each child, at the same time.
#   merge      the newest cell of every line of descent, averaged into this generation's trunk (training/merge.py).
#   gate       a body that multiplies is not judged: one fresh exam of two seeds is sat by the grown body as its pulse,
#              to trace problems back from. (Trials still sit three ways side by side.)
#   record     a job that runs no model and no code the hive wrote. It keeps the cells, the trunk and the rows in the
#              release "hive-grown", writes the numbers into training/reports/generations.jsonl, the body and its
#              levels into cells/body.json, and starts the next generation.
#
# Every night, and by hand from the Actions tab. The jobs that run models have no token
# that can write anywhere.
name: The hive teaches its own members

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "Practice runners, as a JSON list"
        default: "[1,2,3,4,5,6]"
      tasks:
        description: "Practice tasks on each runner (half of the first exam's kinds, half hard ones)"
        default: "16"
      who:
        description: "Who practises (empty: the body's cells; with no cells yet, the DNA as published)"
        default: ""
      organs:
        description: "Empty: the body multiplies (each grown cell has a child, training/lineage.py). A JSON list such as [\"code\",\"data\"]: one cell for each organ named, from the body's cell of that organ, and the body is replaced by them if kept (the old way; trials always do this)"
        default: ""
      epochs:
        description: "Passes over the rows when training, at the most (the time given cuts them; a child starts from its parent and needs few)"
        default: "2"
      dna:
        description: "The body's ternary model: t17 (1.7B, 0.43 GB packed), t40 (4B, 1.0 GB) or t80 (8B, 2.2 GB); t40 and t80 train with the DNA held ternary (--int8-base)"
        default: "t80"
      ternary:
        description: "1: the cells' own edits ternary too (g9: 13 of 64, against 26 for ordinary edits on the same 222 rows); anything else: ordinary numbers"
        default: "0"
      foresee:
        description: "1: the cells are also trained to say what a program prints before it runs"
        default: ""
      dreams:
        description: "How many of the tasks it got wrong before each practice runner goes back to and corrects first (the old program and the check's verdict, numbers hidden); 0: none; empty: 4"
        default: ""
      practice_level:
        description: "ladder (the default): half single tasks, half several tasks in one, as hard as the body's levels say (cells/body.json; each record moves them); mixed: half basic kinds, half hard ones, always the same difficulty; edge: most the kinds the body passes about half the time"
        default: ""
      fresh_rows:
        description: "1: train only on this run's own practice (and rows_from_run), not on every earlier night's rows; for comparing two ways of practising"
        default: ""
      loop:
        description: "0: this run of the line does not start the next one when it ends (the line otherwise grows until stopped: set the repository variable HIVE_LOOP to stop, or disable this workflow)"
        default: ""
      seating:
        description: "strength: the gate and practice seat each task with the cells that were right most often on its kind (cells/strengths.json, written by each night's gate) instead of by the organ's keywords"
        default: ""
      versus:
        description: "A fair test inside one run: a second kind of cell, grown from the very same rows and sat on the same exams, with these training flags added (e.g. --pairs, --foresee, --lr 0.0005, --rank 8). Always a trial"
        default: ""
      pairs:
        description: "1: the cells also learn from a right program set beside a wrong one for the same task (DPO with a likelihood term); needs rows practised since pairs are recorded"
        default: ""
      trial:
        description: "1: a trial beside the line of generations: recorded and kept in the release, but the body is not changed"
        default: ""
      gate_seeds:
        description: "A number that fixes the gate's seeds (two trials given the same number sit the same exams); empty: this run's own"
        default: ""
      slow:
        description: "1: train every layer and recompute the inner values (2.3 times slower; the first two trials that trained this way ran out of time)"
        default: ""
      bench:
        description: "1: nothing is grown; one runner times a training row each way (bf16 or 32-bit floats, all layers or the last 14, with or without recomputing)"
        default: ""
      cells_from_run:
        description: "Nothing is trained: the gate sits the cells an earlier run of this workflow grew (its run id)"
        default: ""
      skip_practice:
        description: "1: no new practice (train from the rows in the release and of rows_from_run)"
        default: ""
      rows_from_run:
        description: "Also take the rows an earlier run of this workflow practised (its run id)"
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: body-${{ (inputs.trial || inputs.versus) && github.run_number || 'line' }}
  cancel-in-progress: false

env:
  AGENT_TEAM_SOLO: "2"
  AGENT_TEAM_SOLO_ALONE: "1"
  HIVE_LIGHT: "1"
  GEN: g${{ github.run_number }}
  DNA: ${{ inputs.dna || 't80' }}
  HIVE_SEATING: ${{ inputs.seating == 'strength' && 'strength' || '' }}

jobs:
  practice:
    if: ${{ !inputs.skip_practice }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards || '[1,2,3,4,5,6]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Who practises (the trunk and the body's cells; a body with no cells yet, its DNA as published)
        run: |
          BODY=$(python3 training/lineage.py members "$DNA")
          echo "HIVE_MEMBERS=${WHO:-$BODY}" >> "$GITHUB_ENV"
        env:
          WHO: ${{ inputs.who || '' }}
      - name: The body's cells, from the release
        run: python3 training/grow_record.py fetch "$HIVE_MEMBERS"
      - uses: ./.github/actions/hive
      - name: Practice
        env:
          LEVEL: ${{ inputs.practice_level || 'ladder' }}
          # every cell takes its turn beside the trunk, a different one on each runner (team/ternary.seating)
          HIVE_ROTATE: ${{ matrix.shard }}
          # the most one task may take: a member that is lost in a task after 25 minutes does not find its way
          HIVE_TASK_SECONDS: "1500"
        run: |
          case "$LEVEL" in mixed|edge|ladder) ;; *) echo "::error::practice_level is ladder, mixed or edge, not $LEVEL"; exit 1 ;; esac
          # the tasks the hive got wrong before (kept in the release); new failures go to failures.jsonl
          curl -sfL -o old_failures.jsonl "https://github.com/${GITHUB_REPOSITORY}/releases/download/hive-grown/failures.jsonl" || : > old_failures.jsonl
          DREAMS="${{ inputs.dreams || '4' }}"
          if [[ "$DREAMS" =~ ^[0-9]{1,2}$ ]] && [ "$DREAMS" -gt 0 ] && [ -s old_failures.jsonl ]; then
            python training/grow.py dream --seed $((30000000 + ${{ github.run_number }} * 100 + ${{ matrix.shard }})) --tasks "$DREAMS" --tries 2 --minutes 60 --failures old_failures.jsonl --out rows.jsonl | tee dream.txt
            tail -1 dream.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          python training/grow.py practice --seed $((10000000 + ${{ github.run_number }} * 100 + ${{ matrix.shard }})) --tasks "${{ inputs.tasks || '16' }}" --minutes 210 --level "$LEVEL" --out rows.jsonl | tee practice.txt
          tail -1 practice.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: rows-${{ matrix.shard }}
          path: |
            rows.jsonl
            failures.jsonl
            practice.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: practice-work-${{ matrix.shard }}
          path: |
            runs/exam/**/TASK.md
            runs/exam/**/REPORT.md
            runs/exam/**/exam.json
            runs/exam/**/member*_*.py
            runs/exam/**/.member*_*.py.out
            runs/exam/**/.member*_*.py.err
          include-hidden-files: true
          retention-days: 14

  gather:
    needs: practice
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rows-*
          path: new
      - uses: actions/download-artifact@v4
        if: ${{ inputs.rows_from_run }}
        with:
          pattern: rows-*
          path: seed
          run-id: ${{ inputs.rows_from_run }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Every row checked so far (the release holds those of earlier generations), and this generation's lessons
        run: |
          if [ "${{ inputs.fresh_rows }}" = "1" ]; then : > old.jsonl; else
            curl -sfL -o old.jsonl "https://github.com/${GITHUB_REPOSITORY}/releases/download/hive-grown/rows.jsonl" || : > old.jsonl
          fi
          mkdir -p new seed out
          # every task got wrong so far (the newest 3000), for the hive to come back to, and for the lessons to show done right
          curl -sfL -o old_failures.jsonl "https://github.com/${GITHUB_REPOSITORY}/releases/download/hive-grown/failures.jsonl" || : > old_failures.jsonl
          python3 training/grow_record.py failures out/failures.jsonl old_failures.jsonl $(find new -name failures.jsonl | sort)
          # lessons (training/lessons.py) only start a kind: a right program, checked by the task's own check, for a kind
          # where the hive has fewer than 3 right programs of its own (with none it has nothing to learn from). Once it
          # has its own, its practice and dreams carry the kind and the lessons stop. Only requests and BeautifulSoup.
          pip install --quiet requests beautifulsoup4
          mkdir -p new/lessons
          python3 training/lessons.py --seed "$GEN" --per-kind 1 --several 4 --failures out/failures.jsonl --most-failures 20 --minutes 25 --own-rows old.jsonl $(find new seed -name rows.jsonl -not -path "new/lessons/*" | sed 's/^/--own-rows /') --out new/lessons/rows.jsonl | tail -1 | tee -a "$GITHUB_STEP_SUMMARY" || echo "::warning::the lessons could not be made; the generation goes on without them"
          # each row once; this generation's are stamped with its name, so training knows them from rows the parents
          # already learned. training/data/rows_*.jsonl: rows kept in the repository (recovered ones) join the old
          python3 training/grow.py gather --gen "$GEN" --out out/rows.jsonl --old old.jsonl $(for f in $(ls training/data/rows_*.jsonl 2>/dev/null); do echo "--old $f"; done) $(find new seed -name rows.jsonl | sort) | tee -a "$GITHUB_STEP_SUMMARY"
          test -s out/rows.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: all-rows
          path: |
            out/rows.jsonl
            out/failures.jsonl
          retention-days: 30

  bench:
    needs: gather
    if: ${{ !cancelled() && needs.gather.result == 'success' && inputs.bench }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Room for the weights, and in memory
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 14G /mnt/hive.swap && sudo chmod 600 /mnt/hive.swap && sudo mkswap -q /mnt/hive.swap && sudo swapon /mnt/hive.swap || true
          lscpu | grep -E "Model name|avx512_bf16" | cut -c1-120 || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: What training needs
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r requirements.txt
          python -c "from team import ternary; ternary.source()"
      - uses: actions/download-artifact@v4
        with:
          name: all-rows
          path: got
      - name: One row, each way
        run: |
          lscpu | grep -o "avx512_bf16" | head -1 || echo "this CPU has no AVX512-BF16"
          python training/grow.py speed --rows got/rows.jsonl --base "$DNA" | tee -a "$GITHUB_STEP_SUMMARY"

  plan:
    runs-on: ubuntu-latest
    outputs:
      children: ${{ steps.plan.outputs.children }}
      grow: ${{ steps.plan.outputs.grow }}
    steps:
      - uses: actions/checkout@v4
      - name: Which cells have children this generation
        id: plan
        env:
          ORGANS: ${{ inputs.organs || ((inputs.trial || inputs.versus) && '["sources","code","data","words"]' || '') }}
        run: |
          C=$(python3 training/lineage.py plan "$GEN" "$DNA" "$ORGANS")
          echo "children=$C" >> "$GITHUB_OUTPUT"
          echo "grow=$([ -z "$ORGANS" ] && echo 1 || echo '')" >> "$GITHUB_OUTPUT"
          echo "children: $C" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$C" != "[]"

  train:
    needs: [gather, plan]
    if: ${{ !cancelled() && needs.gather.result == 'success' && needs.plan.result == 'success' && !inputs.bench && !inputs.cells_from_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 250  # 170 minutes of training and what comes before it; a row that stalls ends the job itself (grow.train)
    strategy:
      fail-fast: false
      matrix:
        child: ${{ fromJSON(needs.plan.outputs.children) }}
        variant: ${{ fromJSON(inputs.versus && '["cell","versus"]' || '["cell"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Room for the weights, and in memory (a runner has 16 GB; training peaks near 11, and a long row must slow it, not kill it)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 14G /mnt/hive.swap && sudo chmod 600 /mnt/hive.swap && sudo mkswap -q /mnt/hive.swap && sudo swapon /mnt/hive.swap || true
          free -g | sed -n 2,3p
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: What training needs
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r requirements.txt
          python -c "from team import ternary; ternary.source()"
      - uses: actions/download-artifact@v4
        with:
          name: all-rows
          path: got
      - name: Grow the cell
        env:
          VERSUS: ${{ matrix.variant == 'versus' && inputs.versus || '' }}
          NAME: ${{ matrix.child.name }}
          ORGAN: ${{ matrix.child.organ }}
          P: ${{ matrix.child.parent }}
        run: |
          # the second kind's flags, only from a short list of known shapes (an input is text anyone dispatching typed)
          [[ "$VERSUS" =~ ^(--(pairs|foresee|ternary|no-checkpoint|lr|rank|epochs|layers|weight|max-len|read|judged)( [a-z0-9.]+)?[ ]?)*$ ]] || { echo "::error::versus: not a known flag list: $VERSUS"; exit 1; }
          # the parent (training/lineage.py, the plan job): the cell whose edit the child starts from, its learning and its
          # corrections inherited, and whose weak kinds the child is trained on harder; none in the first generation of a DNA
          [[ "$NAME" =~ ^g[0-9]+(sources|code|data|words)[0-9]{0,2}$ && "$P" =~ ^(g[0-9]+(sources|code|data|words)[0-9]{0,2})?$ ]] || { echo "::error::not a cell's name: $NAME $P"; exit 1; }
          PARENT=""
          if [ -n "$P" ]; then
            if curl -sfL -o parent.safetensors "https://github.com/${GITHUB_REPOSITORY}/releases/download/hive-grown/$DNA.$P.safetensors"; then PARENT="--parent parent.safetensors --parent-cell $P"; echo "parent: $P" | tee -a "$GITHUB_STEP_SUMMARY"
            else echo "::warning::the parent $P has no weights in the release; the child starts from the DNA"; PARENT="--parent-cell $P"; fi
          fi
          # the body's trunk (training/merge.py): the child starts as its parent pulled halfway toward it
          TRUNK=""
          T=$(python3 -c "import json, os; b=json.load(open('cells/body.json')); print(b.get('trunk') or '' if b.get('dna') == os.environ['DNA'] else '')")
          if [[ "$T" =~ ^g[0-9]+trunk$ ]]; then
            if curl -sfL -o trunk.safetensors "https://github.com/${GITHUB_REPOSITORY}/releases/download/hive-grown/$DNA.$T.safetensors"; then TRUNK="--trunk trunk.safetensors"; echo "trunk: $T" | tee -a "$GITHUB_STEP_SUMMARY"
            else echo "::warning::the trunk $T has no weights in the release; the child starts from its parent alone"; fi
          fi
          # raw data (training/raw.py): web pages, Wikipedia, open code and real code fixes, each measured by the DNA's own
          # error and only the middle band read; and answers people voted on, best beside worst. Repository variables
          # HIVE_READ and HIVE_JUDGED set how many (0: none); a versus trial's own --read/--judged come first and win.
          python training/grow.py train $VERSUS $PARENT $TRUNK --read "${{ vars.HIVE_READ || '40' }}" --judged "${{ vars.HIVE_JUDGED || '10' }}" --gen "$GEN" --rows got/rows.jsonl --base "$DNA" --name "$NAME" --lean "$ORGAN" --epochs "${{ inputs.epochs || '2' }}" --minutes 170 ${{ inputs.ternary == '1' && '--ternary' || '' }} ${{ inputs.foresee && '--foresee' || '' }} ${{ inputs.pairs && '--pairs' || '' }} ${{ !inputs.slow && '--layers last14 --no-checkpoint' || '' }} ${{ (env.DNA == 't40' || env.DNA == 't80') && '--int8-base' || '' }} | tee train.txt
          mkdir out && cp "cells/members/$DNA+$NAME.gguf" "out/$DNA.$NAME.gguf" && cp "cells/members/$DNA+$NAME.json" "out/$DNA.$NAME.json"
          cp "runs/grow/$DNA+$NAME/adapter_model.safetensors" "out/$DNA.$NAME.safetensors" || true
          cat out/*.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-${{ matrix.child.suffix }}
          path: out/
          retention-days: 30

  merge:
    needs: [plan, train]
    # only a body that multiplies has a trunk; it is made of the children that did grow when a runner failed or ran
    # out of time (generation 25 was lost whole because one child's job timed out and every later job was skipped)
    if: ${{ !cancelled() && needs.plan.outputs.grow && (inputs.cells_from_run || needs.train.result != 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cell-*
          path: got
          run-id: ${{ inputs.cells_from_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: What merging needs
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r requirements.txt
          python -c "from team import ternary; ternary.source()"
      - name: The trunk, the newest cell of every line of descent averaged into one edit
        run: |
          mkdir -p leaves out
          GROWN=""
          for d in got/cell-*; do
            n="${GEN}${d#got/cell-}"
            f=$(ls "$d"/*.safetensors 2>/dev/null | head -1)
            if [[ "$n" =~ ^g[0-9]+(sources|code|data|words)[0-9]{0,2}$ ]] && [ -n "$f" ]; then cp "$f" "leaves/$n.safetensors"; GROWN="$GROWN $n"; fi
          done
          PLAN=$(python3 training/lineage.py trunk "$GEN" "$DNA" $GROWN)
          echo "trunk: $PLAN" | tee -a "$GITHUB_STEP_SUMMARY"
          FILES=""
          for n in $(python3 -c "import json, sys; print(' '.join(json.loads(sys.argv[1])['of']))" "$PLAN"); do
            [[ "$n" =~ ^g[0-9]+(sources|code|data|words)[0-9]{0,2}$ ]] || continue
            if [ ! -f "leaves/$n.safetensors" ]; then
              curl -sfL -o "leaves/$n.safetensors" "https://github.com/${GITHUB_REPOSITORY}/releases/download/hive-grown/$DNA.$n.safetensors" || { echo "::warning::the cell $n has no weights in the release; the trunk is made without it"; rm -f "leaves/$n.safetensors"; continue; }
            fi
            FILES="$FILES leaves/$n.safetensors"
          done
          [ -n "$FILES" ] || { echo "::error::no cell's weights to make a trunk of"; exit 1; }
          python training/merge.py trunk work $FILES --rank 32 --base "$DNA" --name "${GEN}trunk" --out-dir made | tee -a "$GITHUB_STEP_SUMMARY"
          cp "made/$DNA+${GEN}trunk.gguf" "out/$DNA.${GEN}trunk.gguf"
          cp "made/$DNA+${GEN}trunk.json" "out/$DNA.${GEN}trunk.json"
          cp work/adapter_model.safetensors "out/$DNA.${GEN}trunk.safetensors"
      - uses: actions/upload-artifact@v4
        with:
          name: trunk
          path: out/
          retention-days: 30

  gate:
    needs: [plan, train, merge]
    # a body that multiplies goes on with the children that did grow when one runner failed
    if: ${{ !cancelled() && (needs.train.result == 'success' || inputs.cells_from_run || (needs.plan.outputs.grow && needs.train.result != 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # a body that multiplies is not judged: it sits once, with its children, as a pulse to trace problems back from.
        # Trials still sit three ways side by side (two runs of the same hive differ by several tasks in 32: four seeds)
        arm: ${{ fromJSON(needs.plan.outputs.grow && '["after"]' || (inputs.versus && '["dna","before","after","versus"]' || '["dna","before","after"]')) }}
        seed: ${{ fromJSON(needs.plan.outputs.grow && '[1,2]' || '[1,2,3,4]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cell-*
          path: got
          run-id: ${{ inputs.cells_from_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ matrix.arm == 'versus' }}
        with:
          pattern: versus-*
          path: vs
      - uses: actions/download-artifact@v4
        if: ${{ needs.plan.outputs.grow }}
        with:
          pattern: trunk
          path: tr
      - name: Who sits (the arm)
        id: who
        env:
          GROW: ${{ needs.plan.outputs.grow }}
          CHILDREN: ${{ needs.plan.outputs.children || '[]' }}
        run: |
          # each cell is named here after the artifact it came in (cell-<organ>), whatever its file was called: in the
          # first trials a slip in this file gave all four cells the same empty name and the gate found none
          for d in got/cell-*; do o=${d#got/cell-}; mv "$d"/*.gguf "got/$DNA.${GEN}$o.gguf"; mv "$d"/*.json "got/$DNA.${GEN}$o.json"; done
          mkdir -p cells/members
          case "${{ matrix.arm }}" in
            dna) WHO=$DNA ;;
            before)
              WHO=$(python3 -c "import json; b=json.load(open('cells/body.json')); print(','.join(b['dna']+'+'+c for c in b['cells']))")
              python3 training/grow_record.py fetch "$WHO" ;;
            after)
              # a body that multiplies sits with its cells before and their children together
              # whose child each new cell is, on this runner only: a child with no record of its own is seated by its parent's
              python3 -c "import json, os; b=json.load(open('cells/body.json')); b.setdefault('parents', {}).update({c['name']: c['parent'] for c in json.loads(os.environ['CHILDREN']) if c['parent']}); json.dump(b, open('cells/body.json', 'w'))"
              if [ "$GROW" = "1" ]; then python3 training/grow_record.py fetch "$(python3 training/lineage.py members "$DNA")"; fi
              for f in got/$DNA.${GEN}*.gguf; do n=$(basename "$f" .gguf); cp "$f" "cells/members/$DNA+${n#$DNA.}.gguf"; done
              # this generation's trunk takes the place of the one before (only the newest answers)
              if [ -f "tr/trunk/$DNA.${GEN}trunk.gguf" ]; then rm -f cells/members/$DNA+g*trunk.gguf; cp "tr/trunk/$DNA.${GEN}trunk.gguf" "cells/members/$DNA+${GEN}trunk.gguf"; fi
              WHO=$(ls cells/members | sed -n "s/^\($DNA+.*\)\.gguf$/\1/p" | paste -sd, -) ;;
            versus)
              # the second kind's cells, under the same names as the first kind's (each arm sits on its own runner)
              for d in vs/versus-*; do o=${d#vs/versus-}; cp "$d"/*.gguf "cells/members/$DNA+${GEN}$o.gguf"; done
              WHO=$(ls cells/members | sed -n 's/\.gguf$//p' | paste -sd, -) ;;
          esac
          echo "who: $WHO" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "HIVE_MEMBERS=$WHO" >> "$GITHUB_ENV"
          echo "who=$WHO" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/hive
        if: ${{ steps.who.outputs.who }}
      - name: A fresh exam, half of the first exam's kinds and half hard ones
        if: ${{ steps.who.outputs.who }}
        run: |
          python training/exam.py sit --level mixed --tasks 16 --seed $((20000000 + ${{ inputs.gate_seeds || github.run_number }} * 10 + ${{ matrix.seed }})) --empty-memory
          cat training/reports/exams/*_mixed.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.who.outputs.who }}
        with:
          name: gate-${{ matrix.arm }}-${{ matrix.seed }}
          path: training/reports/exams/*_mixed.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.who.outputs.who }}
        with:
          name: gate-work-${{ matrix.arm }}-${{ matrix.seed }}
          path: |
            runs/exam/**/TASK.md
            runs/exam/**/REPORT.md
            runs/exam/**/exam.json
            runs/exam/**/events.jsonl
            runs/exam/**/member*_*.py
            runs/exam/**/.member*_*.py.out
            runs/exam/**/.member*_*.py.err
          include-hidden-files: true
          retention-days: 14
      - name: The numbers once more, last in the log
        if: ${{ !cancelled() && steps.who.outputs.who }}
        run: |
          f=$(ls -t training/reports/exams/*_mixed.md | head -1)
          grep -E "✅|❌" "$f" | awk -F'|' '{print $4 "|" $3 "|" $5}' | cut -c1-90
          sed -n 3p "$f"

  record:
    needs: [plan, train, merge, gate]
    if: ${{ !cancelled() && (needs.train.result == 'success' || inputs.cells_from_run || (needs.plan.outputs.grow && needs.train.result != 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # to start the next generation (the line runs until stopped)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cell-*
          path: got
          run-id: ${{ inputs.cells_from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Each cell named after the artifact it came in
        run: for d in got/cell-*; do o=${d#got/cell-}; mv "$d"/*.gguf "got/$DNA.${GEN}$o.gguf"; mv "$d"/*.json "got/$DNA.${GEN}$o.json"; mv "$d"/*.safetensors "got/$DNA.${GEN}$o.safetensors" 2>/dev/null || true; done
      - uses: actions/download-artifact@v4
        with:
          name: all-rows
          path: got
      - uses: actions/download-artifact@v4
        with:
          pattern: gate-*-[0-9]
          path: gate
      - uses: actions/download-artifact@v4
        if: ${{ needs.plan.outputs.grow }}
        with:
          pattern: trunk
          path: tr
      - uses: actions/download-artifact@v4
        if: ${{ needs.plan.outputs.grow && !inputs.cells_from_run }}
        with:
          pattern: rows-*
          path: prac
      - name: The record (only numbers and names this repository knows are taken from the other jobs)
        env:
          VERSUS_FLAGS: ${{ inputs.versus }}
        run: |
          if [ -d tr/trunk ]; then cp tr/trunk/* got/; fi
          mkdir -p prac
          python3 training/grow_record.py gate gate got "$GEN" --dna "$DNA" --practice prac ${{ (inputs.trial || inputs.versus) && '--trial' || '' }} ${{ needs.plan.outputs.grow && '--grow' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the cells and the rows in the release, the numbers and the body in the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view hive-grown >/dev/null 2>&1 || gh release create hive-grown --title "What the hive grew" --notes "The cells of the hive's body (weight edits of its ternary model) and the checked rows they were grown from (training/grow.py). Machine-made." --latest=false
          # What the release holds is added to, never replaced: another run may have recorded since this one read it
          # (2026-11-14: a trial wrote its older copy back and generation 11's 170 rows were gone from the release).
          curl -sfL -o now_rows.jsonl "https://github.com/${GITHUB_REPOSITORY}/releases/download/hive-grown/rows.jsonl" || : > now_rows.jsonl
          curl -sfL -o now_failures.jsonl "https://github.com/${GITHUB_REPOSITORY}/releases/download/hive-grown/failures.jsonl" || : > now_failures.jsonl
          [ -f got/failures.jsonl ] || : > got/failures.jsonl
          python3 training/grow_record.py rows got/rows.jsonl now_rows.jsonl got/rows.jsonl
          python3 training/grow_record.py failures got/failures.jsonl now_failures.jsonl got/failures.jsonl
          gh release upload hive-grown $(ls got/$DNA.${GEN}*.gguf got/$DNA.${GEN}*.json got/$DNA.${GEN}*.safetensors 2>/dev/null) got/rows.jsonl $([ -s got/failures.jsonl ] && echo got/failures.jsonl) --clobber
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the graphs of the hive's progress toward its goal, drawn again from the record just written (docs/PROGRESS.md)
          python3 training/progress.py || echo "::warning::the progress graphs could not be drawn; the record is kept"
          git add training/reports/generations.jsonl cells/body.json $(ls cells/strengths.json 2>/dev/null) docs/PROGRESS.md docs/progress
          git commit -q -m "The hive's body: generation $GEN" || exit 0
          git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" || { git rebase --abort; echo "::error::the record could not be merged with the branch; its line is in this log"; exit 1; }
          git push -q origin "HEAD:${GITHUB_REF_NAME}" || { echo "::error::the record could not be pushed"; exit 1; }
      - name: Grow again at once (the line grows until stopped)
        # Only the line on main, only after a record that went through, never a trial: a broken run does not start
        # another, and the nightly schedule starts the line again if it has stopped. To stop it: set the repository
        # variable HIVE_LOOP to "stop" (Settings, Secrets and variables, Actions, Variables), or disable the workflow.
        if: ${{ github.ref_name == 'main' && !inputs.trial && !inputs.versus && !inputs.cells_from_run && inputs.loop != '0' && vars.HIVE_LOOP != 'stop' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls got/$DNA.${GEN}*.gguf >/dev/null 2>&1 || { echo "::error::no cell grew this generation: the line stops here (read the train jobs' logs)"; exit 1; }
          gh workflow run grow.yml --ref main -f practice_level="${{ inputs.practice_level || 'ladder' }}" -f dna="${{ inputs.dna || 't80' }}" -f seating="${{ inputs.seating }}" -f dreams="${{ inputs.dreams }}" -f pairs="${{ inputs.pairs }}"
          echo "the next generation is started; to stop the line set the repository variable HIVE_LOOP to stop" >> "$GITHUB_STEP_SUMMARY"
