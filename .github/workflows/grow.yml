# The hive grows, with nobody there (training/grow.py).
#
# The hive is one body: one ternary model (its DNA) and many cells, each the DNA with a small weight edit of its
# own. All cells are the same size. Each leans to one organ (sources, code, data, words) and knows the others' work
# too, so any two can check each other.
#
#   practice   several runners at once: the body's own cells do fresh tasks that are never an exam's. A task counts
#              only when two cells agreed and the task's own check, computed by code, confirms the answer.
#   gather     every row checked so far: those of earlier nights (in the release) and tonight's.
#   train      every cell is grown again from the DNA on all the rows, its own organ's rows three times as often.
#              One runner for each cell, at the same time.
#   gate       fresh exam seeds nobody has seen (half the first exam's kinds, half hard ones), sat three ways side
#              by side: the DNA as it was published, the body as it was, the body as regrown.
#   record     a job that runs no model and no code the hive wrote. It keeps the cells and the rows in the release
#              "hive-grown", writes the numbers into training/reports/generations.jsonl, and changes the body
#              (cells/body.json) only when the numbers say it got better.
#
# By hand from the Actions tab; nightly once a generation has been measured. The jobs that run models have no token
# that can write anywhere.
name: The hive teaches its own members

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Practice runners, as a JSON list"
        default: "[1,2,3,4,5,6]"
      tasks:
        description: "Practice tasks on each runner (half of the first exam's kinds, half hard ones)"
        default: "16"
      who:
        description: "Who practises (empty: the body's cells; with no cells yet, the DNA as published)"
        default: ""
      organs:
        description: "The cells to grow, one for each organ named, as a JSON list"
        default: '["sources","code","data","words"]'
      epochs:
        description: "Passes over the rows when training"
        default: "3"
      dna:
        description: "The body's ternary model: t17 (1.7B, 0.43 GB packed) or t40 (4B, 1.0 GB packed)"
        default: "t17"
      ternary:
        description: "1: the cells' own edits are ternary too (the whole cell a BitNet)"
        default: ""
      foresee:
        description: "1: the cells are also trained to say what a program prints before it runs"
        default: ""
      trial:
        description: "1: a trial beside the line of generations: recorded and kept in the release, but the body is not changed"
        default: ""
      gate_seeds:
        description: "A number that fixes the gate's seeds (two trials given the same number sit the same exams); empty: this run's own"
        default: ""
      slow:
        description: "1: train every layer and recompute the inner values (2.3 times slower; the first two trials that trained this way ran out of time)"
        default: ""
      bench:
        description: "1: nothing is grown; one runner times a training row each way (bf16 or 32-bit floats, all layers or the last 14, with or without recomputing)"
        default: ""
      cells_from_run:
        description: "Nothing is trained: the gate sits the cells an earlier run of this workflow grew (its run id)"
        default: ""
      skip_practice:
        description: "1: no new practice (train from the rows in the release and of rows_from_run)"
        default: ""
      rows_from_run:
        description: "Also take the rows an earlier run of this workflow practised (its run id)"
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: body-${{ inputs.trial && github.run_number || 'line' }}
  cancel-in-progress: false

env:
  AGENT_TEAM_SOLO: "2"
  AGENT_TEAM_SOLO_ALONE: "1"
  HIVE_LIGHT: "1"
  GEN: g${{ github.run_number }}
  DNA: ${{ inputs.dna || 't17' }}

jobs:
  practice:
    if: ${{ !inputs.skip_practice }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards || '[1,2,3,4,5,6]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Who practises
        run: |
          BODY=$(python3 -c "import json, os; b=json.load(open('cells/body.json')); d=os.environ['DNA']; print(','.join(d+'+'+c for c in b['cells'] if b['dna']==d) or d)")
          echo "HIVE_MEMBERS=${WHO:-$BODY}" >> "$GITHUB_ENV"
        env:
          WHO: ${{ inputs.who || '' }}
      - name: The body's cells, from the release
        run: python3 training/grow_record.py fetch "$HIVE_MEMBERS"
      - uses: ./.github/actions/hive
      - name: Practice
        run: |
          python training/grow.py practice --seed $((10000000 + ${{ github.run_number }} * 100 + ${{ matrix.shard }})) --tasks "${{ inputs.tasks || '16' }}" --level mixed --out rows.jsonl | tee practice.txt
          tail -1 practice.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rows-${{ matrix.shard }}
          path: rows.jsonl
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: practice-work-${{ matrix.shard }}
          path: |
            runs/exam/**/TASK.md
            runs/exam/**/REPORT.md
            runs/exam/**/exam.json
            runs/exam/**/member*_*.py
            runs/exam/**/.member*_*.py.out
            runs/exam/**/.member*_*.py.err
          include-hidden-files: true
          retention-days: 14

  gather:
    needs: practice
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rows-*
          path: new
      - uses: actions/download-artifact@v4
        if: ${{ inputs.rows_from_run }}
        with:
          pattern: rows-*
          path: seed
          run-id: ${{ inputs.rows_from_run }}
          github-token: ${{ github.token }}
      - name: Every row checked so far (the release holds those of earlier nights)
        run: |
          curl -sfL -o old.jsonl "https://github.com/${GITHUB_REPOSITORY}/releases/download/hive-grown/rows.jsonl" || : > old.jsonl
          mkdir -p new seed out
          cat old.jsonl $(find new seed -name rows.jsonl | sort) > out/rows.jsonl
          echo "rows: $(wc -l < old.jsonl) from earlier nights, $(cat $(find new -name rows.jsonl) /dev/null | wc -l) from tonight's practice, $(cat $(find seed -name rows.jsonl) /dev/null | wc -l) from run '${{ inputs.rows_from_run }}'" | tee -a "$GITHUB_STEP_SUMMARY"
          test -s out/rows.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: all-rows
          path: out/rows.jsonl
          retention-days: 30

  bench:
    needs: gather
    if: ${{ !cancelled() && needs.gather.result == 'success' && inputs.bench }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Room for the weights, and in memory
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 14G /mnt/hive.swap && sudo chmod 600 /mnt/hive.swap && sudo mkswap -q /mnt/hive.swap && sudo swapon /mnt/hive.swap || true
          lscpu | grep -E "Model name|avx512_bf16" | cut -c1-120 || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: What training needs
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r requirements.txt
          python -c "from team import ternary; ternary.source()"
      - uses: actions/download-artifact@v4
        with:
          name: all-rows
          path: got
      - name: One row, each way
        run: |
          lscpu | grep -o "avx512_bf16" | head -1 || echo "this CPU has no AVX512-BF16"
          python training/grow.py speed --rows got/rows.jsonl --base "$DNA" | tee -a "$GITHUB_STEP_SUMMARY"

  train:
    needs: gather
    if: ${{ !cancelled() && needs.gather.result == 'success' && !inputs.bench && !inputs.cells_from_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        organ: ${{ fromJSON(inputs.organs || '["sources","code","data","words"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Room for the weights, and in memory (a runner has 16 GB; training peaks near 11, and a long row must slow it, not kill it)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 14G /mnt/hive.swap && sudo chmod 600 /mnt/hive.swap && sudo mkswap -q /mnt/hive.swap && sudo swapon /mnt/hive.swap || true
          free -g | sed -n 2,3p
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: What training needs
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r requirements.txt
          python -c "from team import ternary; ternary.source()"
      - uses: actions/download-artifact@v4
        with:
          name: all-rows
          path: got
      - name: Grow the cell
        run: |
          python training/grow.py train --rows got/rows.jsonl --base "$DNA" --name "${GEN}${{ matrix.organ }}" --lean "${{ matrix.organ }}" --epochs "${{ inputs.epochs || '3' }}" --minutes 170 ${{ inputs.ternary && '--ternary' || '' }} ${{ inputs.foresee && '--foresee' || '' }} ${{ !inputs.slow && '--layers last14 --no-checkpoint' || '' }} | tee train.txt
          mkdir out && cp "cells/members/$DNA+${GEN}${{ matrix.organ }}.gguf" "out/$DNA.${GEN}${{ matrix.organ }}.gguf" && cp "cells/members/$DNA+${GEN}${{ matrix.organ }}.json" "out/$DNA.${GEN}${{ matrix.organ }}.json"
          cat out/*.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cell-${{ matrix.organ }}
          path: out/
          retention-days: 30

  gate:
    needs: train
    if: ${{ !cancelled() && (needs.train.result == 'success' || inputs.cells_from_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arm: [dna, before, after]
        seed: [1, 2, 3, 4]  # two runs of the same hive differ by several tasks in 32 (engram_stream_31000.json): four seeds, 64 tasks an arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cell-*
          path: got
          run-id: ${{ inputs.cells_from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Who sits (the arm)
        id: who
        run: |
          # each cell is named here after the artifact it came in (cell-<organ>), whatever its file was called: in the
          # first trials a slip in this file gave all four cells the same empty name and the gate found none
          for d in got/cell-*; do o=${d#got/cell-}; mv "$d"/*.gguf "got/$DNA.${GEN}$o.gguf"; mv "$d"/*.json "got/$DNA.${GEN}$o.json"; done
          mkdir -p cells/members
          case "${{ matrix.arm }}" in
            dna) WHO=$DNA ;;
            before)
              WHO=$(python3 -c "import json; b=json.load(open('cells/body.json')); print(','.join(b['dna']+'+'+c for c in b['cells']))")
              python3 training/grow_record.py fetch "$WHO" ;;
            after)
              for f in got/$DNA.${GEN}*.gguf; do n=$(basename "$f" .gguf); cp "$f" "cells/members/$DNA+${n#$DNA.}.gguf"; done
              WHO=$(ls cells/members | sed -n 's/\.gguf$//p' | paste -sd, -) ;;
          esac
          echo "who: $WHO" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "HIVE_MEMBERS=$WHO" >> "$GITHUB_ENV"
          echo "who=$WHO" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/hive
        if: ${{ steps.who.outputs.who }}
      - name: A fresh exam, half of the first exam's kinds and half hard ones
        if: ${{ steps.who.outputs.who }}
        run: |
          python training/exam.py sit --level mixed --tasks 16 --seed $((20000000 + ${{ inputs.gate_seeds || github.run_number }} * 10 + ${{ matrix.seed }})) --empty-memory
          cat training/reports/exams/*_mixed.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.who.outputs.who }}
        with:
          name: gate-${{ matrix.arm }}-${{ matrix.seed }}
          path: training/reports/exams/*_mixed.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.who.outputs.who }}
        with:
          name: gate-work-${{ matrix.arm }}-${{ matrix.seed }}
          path: |
            runs/exam/**/TASK.md
            runs/exam/**/REPORT.md
            runs/exam/**/exam.json
            runs/exam/**/events.jsonl
            runs/exam/**/member*_*.py
            runs/exam/**/.member*_*.py.out
            runs/exam/**/.member*_*.py.err
          include-hidden-files: true
          retention-days: 14
      - name: The numbers once more, last in the log
        if: ${{ !cancelled() && steps.who.outputs.who }}
        run: |
          f=$(ls -t training/reports/exams/*_mixed.md | head -1)
          grep -E "✅|❌" "$f" | awk -F'|' '{print $4 "|" $3 "|" $5}' | cut -c1-90
          sed -n 3p "$f"

  record:
    needs: [train, gate]
    if: ${{ !cancelled() && (needs.train.result == 'success' || inputs.cells_from_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cell-*
          path: got
          run-id: ${{ inputs.cells_from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Each cell named after the artifact it came in
        run: for d in got/cell-*; do o=${d#got/cell-}; mv "$d"/*.gguf "got/$DNA.${GEN}$o.gguf"; mv "$d"/*.json "got/$DNA.${GEN}$o.json"; done
      - uses: actions/download-artifact@v4
        with:
          name: all-rows
          path: got
      - uses: actions/download-artifact@v4
        with:
          pattern: gate-*-[0-9]
          path: gate
      - name: The numbers decide (only numbers and names this repository knows are taken from the other jobs)
        run: python3 training/grow_record.py gate gate got "$GEN" --dna "$DNA" ${{ inputs.trial && '--trial' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the cells and the rows in the release, the numbers and the body in the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view hive-grown >/dev/null 2>&1 || gh release create hive-grown --title "What the hive grew" --notes "The cells of the hive's body (weight edits of its ternary model) and the checked rows they were grown from (training/grow.py). Machine-made." --latest=false
          gh release upload hive-grown got/$DNA.${GEN}*.gguf got/$DNA.${GEN}*.json got/rows.jsonl --clobber
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/reports/generations.jsonl cells/body.json
          git commit -q -m "The hive's body: generation $GEN" || exit 0
          git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push -q origin "HEAD:${GITHUB_REF_NAME}" || echo "the record could not be pushed"
