name: G55 synthetic-dream candidate exam
run-name: G55 fixed held-out tasks with the F4 trained trunk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exam:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      HIVE_LIGHT: "1"
      AGENT_TEAM_SOLO: "2"
      AGENT_TEAM_SOLO_ALONE: "1"
      HIVE_ASSERT_FIRST: "0"
      HIVE_PAGE_CHECKS: "0"
      HIVE_HTTP_CACHE: "0"
      SHARD: ${{ matrix.shard }}
      ARM: child
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the kept G55 body and verify every packed adapter
        run: |
          STUDY=training/experiments/astra_orders/worker_contracts
          gzip -dc "$STUDY/g55-checked-task-texts.json.gz" > "$RUNNER_TEMP/g55-checked-task-texts.json"
          echo "6379846f333435ea1818a5821822b208f26d28da13a4f3ff4fb69983647418e6  $RUNNER_TEMP/g55-checked-task-texts.json" | sha256sum --check
          echo "HIVE_FAMILIAR_TASKS=$RUNNER_TEMP/g55-checked-task-texts.json" >> "$GITHUB_ENV"
          G55_MANIFEST=training/experiments/astra_orders/worker_contracts/g55-contemporaneous.sha256
          python3 -c "import json; assert json.load(open('cells/body.json'))['generation'] == 55"
          WHO=$(python3 training/lineage.py members t80)
          python3 training/grow_record.py fetch "$WHO"
          sha256sum --check "$G55_MANIFEST"
          test "$(wc -l < "$G55_MANIFEST")" -eq 25
          echo "HIVE_MEMBERS=$WHO" >> "$GITHUB_ENV"
      - uses: ./.github/actions/hive
      - name: Record the body and runtime before the workers start
        run: |
          mkdir -p evidence
          python -c "from team.ternary import weights; print(weights('t80'))" > evidence/base-path.txt
          BASE_PATH=$(tail -1 evidence/base-path.txt)
          echo "1376f942aa90e60f7b570c1d81b3916fea1315ff85aa1c4d19006af68fb4b922  $BASE_PATH" | sha256sum --check
          STUDY=training/experiments/astra_orders/worker_contracts
          cp "$STUDY/f4-adapter.json" evidence/f4-adapter.json
          EXPECTED=$(jq -er '.sha256 | select(test("^[a-f0-9]{64}$"))' evidence/f4-adapter.json)
          REF=$(jq -er '.source_ref | select(test("^[a-f0-9]{40}$"))' evidence/f4-adapter.json)
          test "$(jq -er '.file' evidence/f4-adapter.json)" = 't80-hint-dream.gguf'
          curl --fail --show-error --location --retry 3 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REF}/t80-hint-dream.gguf" -o "$RUNNER_TEMP/f4-trunk.gguf"
          echo "$EXPECTED  $RUNNER_TEMP/f4-trunk.gguf" | sha256sum --check
          install -m 644 "$RUNNER_TEMP/f4-trunk.gguf" 'cells/members/t80+g55trunk.gguf'
          python "$STUDY/f4_manifest.py" > evidence/adapters.sha256
          sha256sum --check evidence/adapters.sha256
          sha256sum "$HIVE_FAMILIAR_TASKS" > evidence/familiar-index.sha256
          sha256sum cells/body.json cells/studied.json > evidence/roster.sha256
          python -c "import os, json, platform; print(json.dumps({k:os.environ.get(k) for k in ('GITHUB_SHA','GITHUB_RUN_ID','ARM','SHARD','HIVE_MEMBERS','AGENT_TEAM_SOLO','HIVE_ASSERT_FIRST','HIVE_PAGE_CHECKS','HIVE_HTTP_CACHE')} | {'machine':platform.machine()}, indent=2))" > evidence/assignment.json
      - name: Run this shard of the normal fixed held-out exam
        timeout-minutes: 70
        run: python training/exam.py held --seat "$SHARD" --seats 8 --per 3 --seconds 900
      - name: Preserve the official grade and participant evidence
        if: always()
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path("evidence")
          root.mkdir(exist_ok=True)
          path = Path("training/reports/exams") / f"held_{os.environ['SHARD']}.json"
          if path.exists():
              shutil.copyfile(path, root / path.name)
          for file in Path("runs/exam").rglob("events.jsonl"):
              if file.is_file() and not file.is_symlink():
                  dest = root / file.relative_to("runs/exam")
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(file, dest)
          PY
          if [ -f "evidence/held_${SHARD}.json" ]; then (cd evidence && sha256sum "held_${SHARD}.json" > held.sha256); fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f4-child-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
