# The hive grows by itself here, with nobody watching and no machine of ours switched on.
# Every six hours: the hive as it was is fetched, it harvests a little more text, every body takes its turn
# (cells are born and judged, a new body is founded when it is time), all is measured on passages nobody trained
# on, and the hive as it is now is put back. Free on a public repository; nothing here spends money or logs in.
# Fetch the grown hive onto your own device with:  python training/hive_state.py pull
name: The hive grows

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes a newborn cell is grown for
        default: "10"
      births:
        description: Births for each body in its turn
        default: "3"
      budget:
        description: Minutes the bodies' turns may take in all
        default: "240"

permissions:
  contents: write

concurrency:
  group: hive
  cancel-in-progress: false

jobs:
  turn:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
      MINUTES: ${{ inputs.minutes || '10' }}
      BIRTHS: ${{ inputs.births || '3' }}
      BUDGET: ${{ inputs.budget || '240' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: What a turn needs (the CPU build of torch; no model is downloaded)
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy tokenizers requests huggingface_hub pyarrow beautifulsoup4 lxml psutil
      - name: The hive as it was
        run: python training/hive_state.py pull --force
      - name: A little more text (open datasets and Wikipedia; a failed harvest is not a failed turn)
        run: python -m team harvest --no-dream --more 4 || true
      - name: Every body takes its turn
        run: python -m team body --minutes "$MINUTES" --births "$BIRTHS" --budget "$BUDGET"
      - name: The hive as it is now
        run: |
          python training/hive_state.py pack hive-state.tar.gz > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          gh release view hive-state > /dev/null 2>&1 || gh release create hive-state --title "The hive as it is now" --notes-file notes.md
          gh release upload hive-state hive-state.tar.gz --clobber
          gh release edit hive-state --notes-file notes.md
      - name: One line in the record of its growth
        run: |
          python training/hive_state.py log
          git config user.name "hive"
          git config user.email "hive@users.noreply.github.com"
          git add training/reports/hive_growth.jsonl
          git commit -q -m "The hive took a turn" || exit 0
          git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
          git push -q origin "HEAD:${GITHUB_REF_NAME}" || echo "the record could not be pushed; the hive itself is saved"
