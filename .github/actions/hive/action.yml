# The working hive installed on a runner: the engine (llama.cpp, compiled for the runner's CPU), the packages, the
# browser its web specialist drives, and its cells. About fifteen minutes. Models come from Hugging Face on first use
# (about ten gigabytes, no login). Used by the workflows that run the hive: "Ask the hive", "The hive sits an exam".
name: The working hive on a runner
description: Installs the working hive (engine, tools, browser, cells) on a runner.
runs:
  using: composite
  steps:
    - name: Room for the models (about ten gigabytes)
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: The engine and the tools
      shell: bash
      run: |
        pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
        pip install --quiet -r requirements.txt
        CMAKE_ARGS="-DGGML_NATIVE=ON" pip install --quiet llama-cpp-python==0.3.36
        python -m playwright install --with-deps chromium
        python training/cells_build.py
    - name: The hive's own models (the 4-bit files of llama.cpp), fetched now and made the only engine
      shell: bash
      run: |
        # Left to itself the hive takes the small PyTorch models whenever one of these files is not on the machine
        # yet (team/llm.gguf_available), and on a fresh runner none is. Every sitting on GitHub up to 2026-11-13
        # ran that way: seed 9010, members alone, same code: 6 of 16 in 96 minutes there, 12 of 16 in 24 minutes on
        # a machine that had the files.
        echo "AGENT_TEAM_ENGINE=gguf" >> "$GITHUB_ENV"
        if [ -n "$HIVE_MEMBERS" ] && [ -n "$AGENT_TEAM_SOLO_ALONE" ] && ! echo "$HIVE_MEMBERS" | grep -q coder; then
          echo "every member is a ternary model and the roles are not asked: the 4-bit files are not fetched"
        else
          AGENT_TEAM_ENGINE=gguf python -c "from team import llm, config; print('engine ready:', llm.gguf_available(), sorted(set(config.GGUF_ROSTER.values())))"
        fi
    # Members that are ternary models (team/ternary.py) run on a llama.cpp with kernels for them. Building it takes
    # about 25 minutes, so the binary is kept between runs, one for each kind of CPU the runners have.
    - name: Which CPU this runner has
      id: cpu
      if: ${{ env.HIVE_MEMBERS != '' }}
      shell: bash
      run: echo "cpu=$(lscpu | grep 'Model name' | md5sum | cut -c1-8)" >> "$GITHUB_OUTPUT"
    - name: The ternary runtime, if it was built before
      if: ${{ env.HIVE_MEMBERS != '' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache/hive/ternary/ik_llama.cpp/build/bin
        key: ternary-runtime-7aa7e01-static-${{ steps.cpu.outputs.cpu }}
    - name: The ternary runtime and the members' models
      if: ${{ env.HIVE_MEMBERS != '' }}
      shell: bash
      run: |
        lscpu | grep -E "Model name|^CPU\(s\)" || true
        python -m team.ternary install
        python -m team.ternary fetch
